name: diatrofi_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  path_provider: ^2.1.3
  path: ^1.9.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#F7F9F6"
  image: assets/icon.png
  color_dark: "#10140F"
  image_dark: assets/icon.png
  android_12:
    image: assets/icon.png
    icon_background_color: "#F7F9F6"
    image_dark: assets/icon.png
    icon_background_color_dark: "#10140F"
  web: true

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  macos:
    generate: true
  web:
    generate: true
    background_color: "#F7F9F6"
    theme_color: "#2E7D32"
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/videos/home_hero.mp4